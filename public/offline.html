<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Nomiextra</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0A0A0A;
      color: #F4F4F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; font-weight: 700; }
    p { color: #A3A3A3; max-width: 28rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: .25rem .75rem;
      border: 1px solid #404040;
      border-radius: 9999px;
      font-size: .75rem;
      letter-spacing: .05em;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: .75rem 1.5rem;
      background: #FFFFFF;
      color: #0A0A0A;
      text-decoration: none;
      border-radius: .5rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <span class="badge">Modo offline</span>
  <h1>Sin conexión</h1>
  <p>
    No hay internet en este momento. Los datos que ingreses ahora (asistencias,
    tareas, notas) se guardan localmente y se sincronizarán automáticamente
    cuando vuelva la señal.
  </p>
  <a href="/dashboard/asistencias">Ir a asistencias offline</a>
</body>
</html>
